<script id="course-data" type="application/json">{"title":"被动语态精讲与专项训练","subtitle":"从句子视角，到真实表达","grade":"九年级复习为主 · 含进阶拓展","source":"被动语态精讲与专项训练.docx","questions":[{"id":"d1","group":"diagnostic","prompt":"The classroom ___ every day.（想表达：教室每天被打扫。）","answer":["is cleaned"],"reason":"教室是被打扫的对象；every day 表示日常活动，单数主语用 is，clean 的过去分词是 cleaned。","options":["cleans","is cleaned","is clean"],"correct":1,"analyses":["cleans 为主动谓语，不能表达这里“教室被打扫”的关系。","is + cleaned：一般现在时被动。","is clean 可以表示“教室很干净”的状态，但不是题目要表达的每天打扫这一动作。"],"tag":"动作与状态","caution":"判断语态要看想表达的意思。本题以“每天打扫教室”为情境。","alternatives":[],"origin":"教学补充"},{"id":"d2","group":"diagnostic","prompt":"They built the bridge in 1990. 改为以 The bridge 开头。","answer":["The bridge was built in 1990."],"reason":"the bridge 成为新主语；原句是一般过去时，单数用 was；build → built。执行者泛指 they，通常省略。","options":null,"correct":null,"analyses":null,"tag":"时态与语态","caution":"","alternatives":[],"origin":"教学补充"},{"id":"d3","group":"diagnostic","prompt":"Which sentence is correct?","answer":["The accident happened yesterday."],"reason":"happen 在这里是不及物动词，事故“发生”，没有可提升为主语的宾语。","options":["The accident was happened yesterday.","The accident happened yesterday."],"correct":1,"analyses":["happen 本身表达“发生”，这里不构成被动。","主动形式即可；过去时间用 happened。"],"tag":"适用条件","caution":"","alternatives":[],"origin":"教学补充"},{"id":"d4","group":"diagnostic","prompt":"All the work has ___ finished.","answer":["been"],"reason":"现在完成时的被动是 has/have been + done；been 是 be 的过去分词。","options":["be","being","been"],"correct":2,"analyses":["has 后需要过去分词，不能直接接 be。","being 用于进行被动的结构，不与这里的 has 直接搭配。","has been finished，已经完成。"],"tag":"been / being","caution":"","alternatives":[],"origin":"教学补充"},{"id":"c1","group":"concept","prompt":"The windows ___ (clean) every Monday.","answer":["are cleaned"],"reason":"windows 是复数承受者，日常活动用 are cleaned。","options":null,"correct":null,"analyses":null,"tag":"复数一致","caution":"","alternatives":[],"origin":"教学补充"},{"id":"c2","group":"concept","prompt":"This bridge ___ (build) in 2010.","answer":["was built"],"reason":"过去时间 in 2010；单数 bridge；build 的过去分词不是 builded。","options":null,"correct":null,"analyses":null,"tag":"不规则分词","caution":"","alternatives":[],"origin":"教学补充"},{"id":"c3","group":"concept","prompt":"The homework must ___ (finish) today.","answer":["be finished"],"reason":"must 后接动词原形，所以 be 保持原形；被动意义由 be finished 表达。","options":null,"correct":null,"analyses":null,"tag":"情态被动","caution":"","alternatives":[],"origin":"教学补充"},{"id":"c4","group":"concept","prompt":"Look! The workers are repairing the road. → The road ___ now.","answer":["is being repaired"],"reason":"明确描写正在进行的修路活动：is being + repaired。being 不能省。","options":null,"correct":null,"analyses":null,"tag":"进行被动","caution":"","alternatives":[],"origin":"教学补充"},{"id":"c5","group":"concept","prompt":"The books ___ already ___ (return).","answer":["have; been returned"],"reason":"两空依次填 have 和 been returned。books 为复数；already 和语境表示已完成并与现在相关，用 have already been returned。","options":null,"correct":null,"analyses":null,"tag":"完成被动","caution":"","alternatives":[],"origin":"教学补充"},{"id":"c6","group":"concept","prompt":"The little girl ___ (look after) by her grandparents every weekend.","answer":["is looked after"],"reason":"look after 作为整体具有宾语，可用于被动；after 必须保留。","options":null,"correct":null,"analyses":null,"tag":"短语整体","caution":"","alternatives":[],"origin":"教学补充"},{"id":"e1","group":"clinic","prompt":"The bridge built in 1990.","answer":["The bridge was built in 1990."],"reason":"句子需要完整谓语。bridge 是 built 的承受者，一般过去时补 was。","options":null,"correct":null,"analyses":null,"tag":"漏 be","caution":"","alternatives":[],"origin":"教学补充"},{"id":"e2","group":"clinic","prompt":"The windows is cleaned every day.","answer":["The windows are cleaned every day."],"reason":"语态正确还不够：新主语 windows 为复数，be 用 are。","options":null,"correct":null,"analyses":null,"tag":"一致","caution":"","alternatives":[],"origin":"教学补充"},{"id":"e3","group":"clinic","prompt":"A new library will built next year.","answer":["A new library will be built next year."],"reason":"will 后接 be；一般将来被动的整个结构是 will be built。","options":null,"correct":null,"analyses":null,"tag":"漏 be","caution":"","alternatives":[],"origin":"教学补充"},{"id":"e4","group":"clinic","prompt":"The room has been clean. （想表达“已经打扫完了”）","answer":["The room has been cleaned."],"reason":"此处表达打扫这一动作完成，clean 要用过去分词 cleaned；has been clean 可在其他语境中表示一直处于干净状态。","options":null,"correct":null,"analyses":null,"tag":"动作 / 状态","caution":"","alternatives":[],"origin":"教学补充"},{"id":"e5","group":"clinic","prompt":"The child was looked by his aunt.","answer":["The child was looked after by his aunt."],"reason":"“照顾”是 look after，短语中的介词不能丢。","options":null,"correct":null,"analyses":null,"tag":"介词","caution":"","alternatives":[],"origin":"教学补充"},{"id":"e6","group":"clinic","prompt":"He was made work late.","answer":["He was made to work late."],"reason":"make sb do 变为 sb be made to do，还原 to。","options":null,"correct":null,"analyses":null,"tag":"补 to","caution":"","alternatives":[],"origin":"教学补充"},{"id":"e7","group":"clinic","prompt":"The accident was happened last night.","answer":["The accident happened last night."],"reason":"happen 在此为不及物动词，使用主动形式。","options":null,"correct":null,"analyses":null,"tag":"无被动","caution":"","alternatives":[],"origin":"教学补充"},{"id":"e8","group":"clinic","prompt":"This house is belonged to my aunt.","answer":["This house belongs to my aunt."],"reason":"belong to 表示所属，通常不用被动；house 单数，用 belongs。","options":null,"correct":null,"analyses":null,"tag":"所属关系","caution":"","alternatives":[],"origin":"教学补充"},{"id":"s1","group":"context","prompt":"The train ___ at the station at 8:00 tomorrow, according to the timetable.","answer":["arrives"],"reason":"按时刻表安排的事件可用一般现在时表示将来；arrive 不及物。不能只看到 tomorrow 就填 will be arrived。","options":["arrives","will be arrived","is arrived"],"correct":0,"analyses":["按时刻表说明到站时间，用主动。","arrive 在这里没有被动结构。","不是“被到达”。"],"tag":"时间词不是答案开关","caution":"","alternatives":[],"origin":"教学补充"},{"id":"s2","group":"context","prompt":"The photos ___ (take) by Mia yesterday are on the wall.","answer":["taken"],"reason":"主句已有 are；taken by Mia yesterday 作后置定语，说明照片“被拍摄”，无需再加 were。","options":null,"correct":null,"analyses":null,"tag":"非谓语","caution":"","alternatives":[],"origin":"教学补充"},{"id":"s3","group":"context","prompt":"Listen! The song ___ (sing) by the children next door.","answer":["is being sung"],"reason":"Listen! 和现场动作共同指向正在发生；song 是被唱的，sing → sung。","options":null,"correct":null,"analyses":null,"tag":"现场进行","caution":"","alternatives":[],"origin":"教学补充"},{"id":"s4","group":"context","prompt":"Please follow the rules. 改成以 The rules 开头的校园告示。","answer":["The rules must be followed.","The rules should be followed."],"reason":"告示可以根据语气用 must（必须）或 should（应当）+ be followed；这是任务允许的不同表达。","options":null,"correct":null,"analyses":null,"tag":"交际目的","caution":"","alternatives":[],"origin":"教学补充"},{"id":"s5","group":"context","prompt":"The cake tastes good. 这里的 tastes 应改成 is tasted 吗？","answer":["不需要。tastes 是连系动词，描述蛋糕的味道。"],"reason":"taste 作“尝起来”时是系动词，用主动形式。The cake was tasted by the chef 则表示厨师尝了蛋糕，是另一种用法。","options":null,"correct":null,"analyses":null,"tag":"动词意义","caution":"","alternatives":[],"origin":"教学补充"},{"id":"s6","group":"context","prompt":"The box ___ (open) easily. 我在介绍盒子的设计特点。","answer":["opens"],"reason":"语境是在说盒子“容易打开”的属性，opens easily 是主动形式表达被动意味；描述一次打开事件时可用 was opened。","options":null,"correct":null,"analyses":null,"tag":"属性与事件","caution":"","alternatives":[],"origin":"教学补充"},{"id":"o1","group":"source-choice","prompt":"Breakfast ______ every day for people over 60 for free in this village. ","answer":["is provided"],"reason":"Breakfast 是被提供的对象，every day 表示常规做法，单数主语用 is provided。","options":["provides","provided","is provided","was provided"],"correct":2,"analyses":["provides 是主动。","provided 缺少构成被动的助动词。","is provided：一般现在时被动。","was provided 是过去时，不合每天的常规语境。"],"tag":"一般现在被动","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"o2","group":"source-choice","prompt":"—Tom, the highspeed railway ______ this year hopefully. \n—Amazing! I’m looking forward to it! ","answer":["will be completed"],"reason":"对话表达希望铁路今后完工，且回答说“期待”，因此选将来被动。","options":["completes","is completed","was completed","will be completed"],"correct":3,"analyses":["completes 为主动。","is completed 常指通常的安排或状态，不合此处期待完工的语境。","was completed 表过去完成的事件。","will be completed 表将被建成。"],"tag":"将来语境","caution":"this year 本身并不等于将来时；还要结合 hopefully 和 I’m looking forward to it。","alternatives":[],"origin":"原稿练习"},{"id":"o3","group":"source-choice","prompt":"China’s Beijing Library ______ “Public Library of the Year” in 2024. ","answer":["was named"],"reason":"图书馆是被命名、被授予称号的对象；原题把 2024 年作为过去事件时间，用 was named。","options":["named","was named","will be named"],"correct":1,"analyses":["named 是主动的过去式，缺少被动助动词。","was named：一般过去时被动。","will be named 表将来。"],"tag":"一般过去被动","caution":"原题未注明出处；此处仅分析所给语言结构，不把奖项信息当作已核验事实。","alternatives":[],"origin":"原稿练习"},{"id":"o4","group":"source-choice","prompt":"Language learning apps ______ by more and more people these days. ","answer":["are used"],"reason":"apps 是复数，被越来越多的人使用；给定选项中 are used 符合 these days 的当前使用状况。","options":["use","used","are used","were used"],"correct":2,"analyses":["use 为主动。","used 缺少助动词。","are used：复数主语的一般现在时被动。","were used 为过去时。"],"tag":"主谓一致","caution":"these days 可与不同的当前时态配合，不能只凭这个短语机械判为进行时。","alternatives":[],"origin":"原稿练习"},{"id":"o5","group":"source-choice","prompt":"Something ______ to keep him relaxed. He is too tired. ","answer":["should be done"],"reason":"Something 与 do 构成承受关系：应当做点事情，用 should be done。","options":["should do","should be done","must do"],"correct":1,"analyses":["should do 为主动。","should be done：情态动词被动。","must do 仍是主动，也不能表达 Something 被处理。"],"tag":"情态被动","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"o6","group":"source-choice","prompt":"Many old trees ______ along the street last spring. ","answer":["were planted"],"reason":"old trees 是复数承受者，last spring 表示过去，用 were planted。","options":["plant","are planted","were planted"],"correct":2,"analyses":["plant 为主动原形。","are planted 是现在时。","were planted：复数主语的过去被动。"],"tag":"过去与复数","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"o7","group":"source-choice","prompt":"Teenagers ______ to take care of themselves from an early age. ","answer":["should be taught"],"reason":"青少年是“被教会照顾自己”的对象，用 should be taught。","options":["should teach","should be taught","teach"],"correct":1,"analyses":["should teach 表示青少年应教别人。","should be taught：taught 是 teach 的过去分词。","teach 是主动。"],"tag":"情态被动","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"o8","group":"source-choice","prompt":"A lot of information about space ______ when the rover lands on Mars. ","answer":["will be collected"],"reason":"信息将被收集；when 从句用一般现在时 lands 表示将来，主句用 will be collected。","options":["collects","collected","will be collected"],"correct":2,"analyses":["collects 为主动，且 information 为不可数名词。","collected 缺少被动助动词。","will be collected：将来被动。"],"tag":"主将从现","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"o9","group":"source-choice","prompt":"—Why didn’t you go to the party? —Because I ______ to come. ","answer":["wasn’t asked"],"reason":"过去没有去聚会，因为“我没有被邀请来”，用过去被动的否定形式。","options":["didn’t ask","wasn’t asked","haven’t asked"],"correct":1,"analyses":["didn’t ask 意为“我没有问/要求别人”。","wasn’t asked：我没有被邀请。","haven’t asked 仍为主动，也不合此处过去叙事。"],"tag":"否定被动","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"o10","group":"source-choice","prompt":"The children ______ to protect wild animals by the teacher yesterday. ","answer":["were told"],"reason":"children 是复数，被老师告知；yesterday 指过去，用 were told。","options":["told","were told","tell"],"correct":1,"analyses":["told 缺少被动助动词。","were told：过去被动，后面的 to protect 保留。","tell 为主动原形。"],"tag":"tell sb to do","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"f1","group":"source-fill","prompt":"Hundreds of factories ________ (encourage) to move away between 2005 and 2015.","answer":["were encouraged"],"reason":"factories 为复数，between 2005 and 2015 明确限定过去时间，用 were encouraged。","options":null,"correct":null,"analyses":null,"tag":"一般过去","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"f2","group":"source-fill","prompt":"The letter ________ (send) to you as soon as I arrive.","answer":["will be sent"],"reason":"“我一到就寄信”指将来：主句 will be sent，as soon as 从句用 arrive。","options":null,"correct":null,"analyses":null,"tag":"主将从现","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"f3","group":"source-fill","prompt":"Many wonderful paintings ________ (show) in the museum now.","answer":["are being shown","are shown"],"reason":"如果 now 表示此刻正在展出，are being shown；如果描述当前陈列状态，are shown 也自然。","options":null,"correct":null,"analyses":null,"tag":"语境多解","caution":"now 不足以排除状态性的 are shown；应结合要描述的过程或状态判断。","alternatives":[],"origin":"原稿练习"},{"id":"f4","group":"source-fill","prompt":"All the rules ________ (must follow) by every student.","answer":["must be followed"],"reason":"规则是被遵守的，情态动词 must 后接 be followed。","options":null,"correct":null,"analyses":null,"tag":"情态被动","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"f5","group":"source-fill","prompt":"A new hospital ________ (build) in our town next year.","answer":["will be built","is going to be built"],"reason":"医院是将被修建的对象；next year 表未来，可用 will be built，或在已计划语境中用 is going to be built。","options":null,"correct":null,"analyses":null,"tag":"一般将来","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"f6","group":"source-fill","prompt":"So far, many new words ________ (learn) by the students.","answer":["have been learned","have been learnt"],"reason":"So far 表示到目前为止；new words 复数，用 have been learned/learnt。","options":null,"correct":null,"analyses":null,"tag":"现在完成","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"f7","group":"source-fill","prompt":"The little boy ________ (see) to run out of the room just now.","answer":["was seen"],"reason":"just now 指过去；boy 是被看见的，was seen to run 中的 to 已在原题给出。","options":null,"correct":null,"analyses":null,"tag":"感官结构","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"f8","group":"source-fill","prompt":"This kind of bike ________ (sell) very well.（主动表被动）","answer":["sells"],"reason":"原题已说明描述商品属性，用主动形式；This kind 作单数主语，所以 sells。","options":null,"correct":null,"analyses":null,"tag":"主动表被动","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"f9","group":"source-fill","prompt":"The lost keys ________ (find) under the bench yesterday.","answer":["were found"],"reason":"keys 是复数承受者，yesterday 指过去，find → found。","options":null,"correct":null,"analyses":null,"tag":"不规则分词","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"f10","group":"source-fill","prompt":"Students ________ (ask) not to bring mobile phones into the exam room.","answer":["are asked"],"reason":"按一般考场规定理解，用 are asked；not to bring 保留否定不定式。","options":null,"correct":null,"analyses":null,"tag":"语境条件","caution":"原句没有明确的叙事时间。are asked 为常规规定的参考表达；若补充过去通知的语境，were asked 也成立。","alternatives":[],"origin":"原稿练习"},{"id":"f11","group":"source-fill","prompt":"The problem ________ (discuss) at the meeting tomorrow afternoon.","answer":["will be discussed","is going to be discussed"],"reason":"问题将被讨论；tomorrow afternoon 表未来，单数 problem。","options":null,"correct":null,"analyses":null,"tag":"一般将来","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"f12","group":"source-fill","prompt":"Tea ________ (grow) in many places in China.","answer":["is grown"],"reason":"茶叶被种植；Tea 为不可数名词，一般情况用 is grown。","options":null,"correct":null,"analyses":null,"tag":"一般现在","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"p1-1","group":"passage1","prompt":"Last term, I 1. ______ (invite) to join the school music club","answer":["was invited"],"reason":"Last term 限定过去；I 是被邀请的人，用 was invited。","options":null,"correct":null,"analyses":null,"tag":"过去被动","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"p1-2","group":"passage1","prompt":"Our teacher told us that music 2. ______ (connect) people from different ages and places","answer":["connects"],"reason":"music 是“连接人们”的发出者；陈述通常作用，music 不可数，用 connects。","options":null,"correct":null,"analyses":null,"tag":"主动谓语","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"p1-3","group":"passage1","prompt":"Every Friday afternoon, we get together 3. ______ (practise) singing and playing instruments","answer":["to practise"],"reason":"get together 后说明聚在一起的目的，用不定式 to practise。","options":null,"correct":null,"analyses":null,"tag":"目的不定式","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"p1-4","group":"passage1","prompt":"A new piece of soft music 4. ______ (teach) to us this week","answer":["is being taught","has been taught","was taught"],"reason":"强调本周正在教，用 is being taught；强调本周已经教过，用 has been taught；若叙述本周较早已发生的一课，was taught 也可能。","options":null,"correct":null,"analyses":null,"tag":"语境多解","caution":"this week 单独不足以确定唯一时态。教学时先让学生补充“还在教 / 已教完”的语境，再选择。","alternatives":[],"origin":"原稿练习"},{"id":"p1-5","group":"passage1","prompt":"He said the song 5. ______ (create) to show his love for his hometown","answer":["was created"],"reason":"主句 said 和作品创作的叙事语境指向过去，song 是被创作的对象，用 was created。","options":null,"correct":null,"analyses":null,"tag":"过去被动","caution":"若刻意强调先于 said 完成，也可能使用 had been created；原题未给出这类时间对比。","alternatives":[],"origin":"原稿练习"},{"id":"p1-6","group":"passage1","prompt":"When I feel stressed, I enjoy 6. ______ (listen) to gentle music","answer":["listening"],"reason":"enjoy 后接动名词，enjoy listening to music。","options":null,"correct":null,"analyses":null,"tag":"固定搭配","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"p1-7","group":"passage1","prompt":"I also hope 7. ______ (write) my own songs one day","answer":["to write"],"reason":"hope 后接不定式，hope to write。","options":null,"correct":null,"analyses":null,"tag":"固定搭配","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"p1-8","group":"passage1","prompt":"Not all good music 8. ______ (know) by lots of people","answer":["is known"],"reason":"music 为不可数名词；“被许多人知晓”用 is known。Not all 表示“并非所有”。","options":null,"correct":null,"analyses":null,"tag":"不可数主语","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"p1-9","group":"passage1","prompt":"Some wonderful works stay unknown because they 9. ______ (not spread) widely online yet","answer":["have not been spread","haven’t been spread"],"reason":"works 是复数；yet 与现在相关的未完成语境用 have not been spread，spread 三种形式相同。","options":null,"correct":null,"analyses":null,"tag":"完成被动","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"p1-10","group":"passage1","prompt":"I believe more beautiful music 10. ______ (share) with the world in the future","answer":["will be shared"],"reason":"in the future 表未来；music 为被分享的对象，用 will be shared。","options":null,"correct":null,"analyses":null,"tag":"将来被动","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"p2-1","group":"passage2","prompt":"Last month, a speech about Mars 1. ______ (give) in our school hall","answer":["was given"],"reason":"Last month 指过去；speech 是被作出的，用 was given。","options":null,"correct":null,"analyses":null,"tag":"过去被动","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"p2-2","group":"passage2","prompt":"The speaker was an engineer who 2. ______ (work) for space projects for ten years","answer":["had worked","has worked"],"reason":"以“上月演讲时”为过去参照点，十年经历可用 had worked；如果说话者把这段经历作为持续至今的事实介绍，has worked 也可。","options":null,"correct":null,"analyses":null,"tag":"参照时间","caution":"原文缺少明确参照时间。for ten years 表持续时长，本身不决定用哪一种完成时。","alternatives":[],"origin":"原稿练习"},{"id":"p2-3","group":"passage2","prompt":"He told us that a new rover 3. ______ (send) to Mars in three years","answer":["would be sent","will be sent"],"reason":"按过去视角转述未来计划，用 would be sent；若计划在说话时仍有效且保留现在视角，也可用 will be sent。","options":null,"correct":null,"analyses":null,"tag":"转述与被动","caution":"in three years 需明确从演讲时还是从现在计时。课堂主讲 would be sent，并说明语境条件。","alternatives":[],"origin":"原稿练习"},{"id":"p2-4","group":"passage2","prompt":"It 4. ______ (use) to look for signs of water","answer":["would be used","will be used"],"reason":"承接前句的未来计划，用 would be used；若前句采用现在视角 will be sent，此处可用 will be used。","options":null,"correct":null,"analyses":null,"tag":"视角一致","caution":"与上一空保持叙述视角一致，不孤立机械选时态。","alternatives":[],"origin":"原稿练习"},{"id":"p2-5","group":"passage2","prompt":"Many photos 5. ______ (take) by it will be sent back to Earth","answer":["taken"],"reason":"主句已有 will be sent；taken by it 是修饰 photos 的过去分词短语，表示“由它拍摄的照片”。","options":null,"correct":null,"analyses":null,"tag":"非谓语被动","caution":"这里不能填 were taken，除非重写为带关系词的定语从句。","alternatives":[],"origin":"原稿练习"},{"id":"p2-6","group":"passage2","prompt":"The engineer advised us 6. ______ (study) hard if we want to do space research","answer":["to study"],"reason":"advise sb to do，us 后填 to study。","options":null,"correct":null,"analyses":null,"tag":"不定式","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"p2-7","group":"passage2","prompt":"He also said that he often sees young scientists 7. ______ (try) new ideas again and again, even after failures","answer":["try","trying"],"reason":"see sb do 强调整个动作或反复行为，用 try；see sb doing 强调观察到进行中的行为，trying 也符合语法。","options":null,"correct":null,"analyses":null,"tag":"感官结构","caution":"again and again 使 try 很自然，但不能据此把 trying 一概判错。","alternatives":[],"origin":"原稿练习"},{"id":"p2-8","group":"passage2","prompt":"Space tasks require 8. ______ (check) many times before launch","answer":["checking","to be checked"],"reason":"require doing 可以表达被动含义；也可写 require to be done，因此 checking / to be checked 均可。","options":null,"correct":null,"analyses":null,"tag":"need / require doing","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"p2-9","group":"passage2","prompt":"At the end of the speech, we 9. ______ (tell) that human exploration of space 10","answer":["were told"],"reason":"At the end of the speech 承接上月演讲，we 是被告知的人，用 were told。","options":null,"correct":null,"analyses":null,"tag":"过去被动","caution":"","alternatives":[],"origin":"原稿练习"},{"id":"p2-10","group":"passage2","prompt":"______ (tell) that human exploration of space 10. ______ (not stop) for a long time","answer":["would not stop","wouldn’t stop","will not stop","won’t stop"],"reason":"按过去视角转述未来用 would not stop；保留仍有效的未来判断时可用 will not stop。stop 在此表示“探索不会停止”，用主动形式。","options":null,"correct":null,"analyses":null,"tag":"转述与主动","caution":"语态由主语与动作关系决定；不能看到 exploration 是事物就添加被动。","alternatives":[],"origin":"原稿练习"},{"id":"x1","group":"exit","prompt":"The letter ___ (write) by Amy yesterday.","answer":["was written"],"reason":"过去时间 yesterday；letter 承受 write，write → written。","options":null,"correct":null,"analyses":null,"tag":"基础","caution":"","alternatives":[],"origin":"教学补充"},{"id":"x2","group":"exit","prompt":"Our classroom must ___ (keep) clean.","answer":["be kept"],"reason":"情态被动 must be kept；clean 为补足语，保留。","options":null,"correct":null,"analyses":null,"tag":"补足语","caution":"","alternatives":[],"origin":"教学补充"},{"id":"x3","group":"exit","prompt":"The report has been finished. 写一般疑问句。","answer":["Has the report been finished?"],"reason":"把第一个助动词 has 提到主语前；been finished 保持顺序。","options":null,"correct":null,"analyses":null,"tag":"疑问","caution":"","alternatives":[],"origin":"教学补充"},{"id":"x4","group":"exit","prompt":"Someone stole my bike. 以 My bike 开头。","answer":["My bike was stolen."],"reason":"强调被偷的车，原句过去时；someone 不明确，可省 by 短语。","options":null,"correct":null,"analyses":null,"tag":"转换","caution":"","alternatives":[],"origin":"教学补充"},{"id":"x5","group":"exit","prompt":"The meeting ___ (take place) yesterday.","answer":["took place"],"reason":"take place 表示发生、举行，通常不用被动。take → took。","options":null,"correct":null,"analyses":null,"tag":"适用条件","caution":"","alternatives":[],"origin":"教学补充"},{"id":"x6","group":"exit","prompt":"The photos ___ (show) in the book were taken by my sister.","answer":["shown"],"reason":"主句谓语是 were taken；shown in the book 作修饰 photos 的非谓语短语。","options":null,"correct":null,"analyses":null,"tag":"迁移","caution":"","alternatives":[],"origin":"教学补充"}],"passages":[{"id":"music","title":"Music brings us together","subtitle":"原稿 Passage 1 · 谓语、非谓语与语境","paragraphs":["Music has become an important part of my life. Last term, I 1. ______ (invite) to join the school music club. Our teacher told us that music 2. ______ (connect) people from different ages and places.","Every Friday afternoon, we get together 3. ______ (practise) singing and playing instruments. A new piece of soft music 4. ______ (teach) to us this week. It was written by a local musician. He said the song 5. ______ (create) to show his love for his hometown.","When I feel stressed, I enjoy 6. ______ (listen) to gentle music. It helps me keep calm. I also hope 7. ______ (write) my own songs one day.","Not all good music 8. ______ (know) by lots of people. Some wonderful works stay unknown because they 9. ______ (not spread) widely online yet. I believe more beautiful music 10. ______ (share) with the world in the future."],"theme":"音乐社团"},{"id":"space","title":"A journey beyond Earth","subtitle":"原稿 Passage 2 · 被动、定语与转述","paragraphs":["Space exploration interests more and more teenagers these days. Last month, a speech about Mars 1. ______ (give) in our school hall. The speaker was an engineer who 2. ______ (work) for space projects for ten years.","He told us that a new rover 3. ______ (send) to Mars in three years. It 4. ______ (use) to look for signs of water. Many photos 5. ______ (take) by it will be sent back to Earth.","The engineer advised us 6. ______ (study) hard if we want to do space research. He also said that he often sees young scientists 7. ______ (try) new ideas again and again, even after failures.","Space tasks require 8. ______ (check) many times before launch. Nothing can go wrong. At the end of the speech, we 9. ______ (tell) that human exploration of space 10. ______ (not stop) for a long time."],"theme":"太空探索"}],"tenses":[{"name":"一般现在","level":"核心","form":"am / is / are + done","example":"The classroom is cleaned every day.","active":"We clean the classroom every day.","clue":"日常活动 / 通常事实","explain":"先确定“每天打扫”的日常语境，再按 classroom 单数选择 is。","negative":"The classroom is not cleaned every day.","question":"Is the classroom cleaned every day?"},{"name":"一般过去","level":"核心","form":"was / were + done","example":"The bridge was built in 1990.","active":"They built the bridge in 1990.","clue":"已发生的过去事件","explain":"in 1990 给出过去时间；bridge 单数，用 was，build → built。","negative":"The bridge was not built in 1990.","question":"Was the bridge built in 1990?"},{"name":"一般将来","level":"核心","form":"will be + done","example":"A new library will be built next year.","active":"They will build a new library next year.","clue":"将来的计划 / 预测","explain":"will 后的 be 用原形。已有计划也可用 is going to be built。","negative":"A new library will not be built next year.","question":"Will a new library be built next year?"},{"name":"情态动词","level":"核心","form":"must / should / can + be + done","example":"The rules must be followed.","active":"Everyone must follow the rules.","clue":"必须 / 应当 / 能够","explain":"情态动词决定语气，be + done 表被动。must 后不能用 are。","negative":"The rules must not be broken.","question":"Must the rules be followed?"},{"name":"现在完成","level":"进阶","form":"have / has been + done","example":"The work has already been finished.","active":"We have already finished the work.","clue":"与现在有关的完成 / 持续","explain":"has/have 承担限定时态和一致；been 是 be 的过去分词。","negative":"The work has not been finished.","question":"Has the work been finished?"},{"name":"现在进行","level":"进阶","form":"am / is / are being + done","example":"The bridge is being repaired now.","active":"The workers are repairing the bridge now.","clue":"明确正在发生的动作","explain":"is being repaired = 正在被修；不要遗漏表示进行的 being。","negative":"The bridge is not being repaired now.","question":"Is the bridge being repaired now?"},{"name":"过去进行","level":"拓展","form":"was / were being + done","example":"The road was being repaired at eight yesterday.","active":"Workers were repairing the road at eight yesterday.","clue":"过去某时正在进行","explain":"把进行中的参照时间放在过去：was/were being + done。","negative":"The road was not being repaired then.","question":"Was the road being repaired then?"},{"name":"过去完成","level":"拓展","form":"had been + done","example":"The work had been finished before we arrived.","active":"They had finished the work before we arrived.","clue":"先于另一过去时间完成","explain":"before we arrived 给出过去参照；先完成的工作用 had been finished。","negative":"The work had not been finished before we arrived.","question":"Had the work been finished before we arrived?"}],"transforms":[{"active":["We","clean","the classroom","every day."],"passive":["The classroom","is cleaned","by us","every day."],"why":["把承受者 the classroom 放到句首；普通名词只需注意句首大写。","原句一般现在时；新主语单数，所以 clean → is cleaned。","执行者 we 放到 by 后用宾格 us。泛指执行者时，by us 可省。"]},{"active":["They","built","the bridge","in 1990."],"passive":["The bridge","was built","by them","in 1990."],"why":["the bridge 是 build 的承受者，提升为新主语。","原句 built 为过去式；新主语单数，用 was built。","they → by them。这里执行者不明确，通常省略。"]},{"active":["She","helps","him","every weekend."],"passive":["He","is helped","by her","every weekend."],"why":["宾格 him 提到主语位置，要改成主格 He。","helps 表一般现在；He 单数，所以用 is helped。","主动主语 she 放在 by 后改为 her。"]},{"active":["The volunteers","will plant","many trees","tomorrow."],"passive":["Many trees","will be planted","by the volunteers","tomorrow."],"why":["many trees 是被种植的对象，作为新主语。","保持原来的将来时间：will plant → will be planted。","这里志愿者身份有信息价值，可以保留 by the volunteers。"]}],"notes":[{"title":"导入与目标","goal":"让学生先看事件，再看句子；建立“关注谁”的语用意识。","ask":"先问：邮递员、信，谁可以成为这句话的主角？点击两种焦点。","guide":"两种表达叙述同一递信事件，但讨论的出发点不同。","watch":"别先要求背八种结构；先让学生说出这次想介绍谁。"},{"title":"诊断起点","goal":"识别漏 be、分词、一致和无被动等先备误区。","ask":"四题先独立作答，暂不揭示；让学生说明一句理由。","guide":"按错误类型选讲：d1 语义，d2 过去分词，d3 适用条件，d4 been。","watch":"诊断只用于调整讲授，避免一开始就把模糊语境当成学生错误。"},{"title":"看见意义","goal":"会根据交际目的选择主动或被动。","ask":"问：窗户碎了，你知道是谁打碎的吗？新闻要介绍发明，应该先说谁？","guide":"不知道执行者、执行者不重要、承受者是话题，均可能用被动。","watch":"by 不一定引出执行者；by bus、by Friday 不是被动的充分证据。"},{"title":"搭建结构","goal":"理解时态、主谓一致和被动意义各由什么表达。","ask":"让学生圈“限定的第一个助动词”，框出整条被动谓语链。","guide":"简单时态由 be 变化；完成时由 has/have 限定，未来和情态由 will/must 等领头。","watch":"“done 不变”指同一动词的分词不随人称时态变化；不代表所有动词都加 -ed。"},{"title":"句子变身","goal":"转换语态同时保持原事件、时态和时间状语。","ask":"逐步展示，每一步先问学生再点：谁到前面？谓语怎么保留时间？by 后用什么格？","guide":"让学生反向检查：新句子的承受者、时态、单复数、分词都对吗？","watch":"转换练习只是一种支架；真实写作还要判断被动是否自然、信息焦点是否合适。"},{"title":"时态工坊","goal":"核心四类先掌握，进阶按需要展开。","ask":"每次只选一张时态卡；先读主动句，再预测被动谓语。","guide":"重点比较 is done / is being done / has been done。","watch":"时间词是线索，不是自动选择时态的按钮；先确定要表达的事件与时间关系。"},{"title":"句式变化","goal":"否定和疑问处理第一个助动词，不破坏被动链。","ask":"让学生在 has been finished / will be built 中找最前面的助动词。","guide":"not 接在第一个助动词后；一般疑问句把第一个助动词提前。","watch":"完成被动的疑问式是 Has ... been done?，不能写 Been ... has done?"},{"title":"特殊结构","goal":"把双宾语、感官使役、介词短语分开处理。","ask":"先问原句结构，学生说出是哪一类，再选规则。","guide":"give 的人/物两种主语；make do → be made to do；look after 保留 after。","watch":"let / have 不机械套 to；be made of 和 made to do 是不同结构。"},{"title":"避坑诊所","goal":"能定位错误类型并解释修正理由。","ask":"每题先说错在哪里，再改句子，最后给一个反例。","guide":"如 The cake tastes good 与 The cake was tasted by the chef；动词意义改变，结构可能改变。","watch":"不要把 own、make up 永久列为无被动；不要用“主语是物”作为唯一判断。"},{"title":"解题路线","goal":"按谓语位置、动作关系、时间、形式四步作答。","ask":"先分析 The photos taken by Mia are on the wall：主句的谓语已经是什么？","guide":"找谓语 → 看关系 → 定时间与一致 → 检查完整动词链。","watch":"遇到语境不充分时允许条件式答案，追问“补哪一句话才能唯一作答”。"},{"title":"原题精练","goal":"保留原稿题目，检验结构与语境判断。","ask":"课堂可选 o1/o2/o8/o9 与 f3/f6/f10；其余作分层巩固。","guide":"让学生先选再说理由，打开解析后讨论干扰项。","watch":"原稿称真题但未提供出处，本课件统一称原稿练习；答案为教师参考推导。"},{"title":"语篇工坊","goal":"区分主动/被动谓语、非谓语和转述视角。","ask":"音乐篇先找固定搭配；太空篇先找主句谓语，再讲 photos taken。","guide":"重点空：P1-4 语境，P2-2 完成时参照，P2-3/4 转述，P2-5 非谓语，P2-7 感官。","watch":"部分空有多种合理表达，应比较语境与意义，不能只展示唯一答案。"},{"title":"迁移与离堂","goal":"在真实告示、报道和工序说明中选择恰当语态。","ask":"先给读者和任务，再让学生决定主动/被动；请同桌用清单互评。","guide":"离堂六题按基础、结构、迁移分层；据错因安排下一次复习。","watch":"参考范文只是可行表达，不要求每句话被动，也不应为追求被动而写不自然的句子。"},{"title":"备课与修订","goal":"了解范围、选讲路线、修订依据与题目多解。","ask":"先读修订记录，再决定班级需要哪些拓展。","guide":"全部原稿题目保留；新增30题和3项输出任务；核心/进阶/拓展分层。","watch":"不宣称已核验考试出处或题目所述现实事件；本课以语言教学为目标。"}]}</script>

</div><div class="scene-note controls"><button class="btn soft focus-toggle" data-focus="active" aria-pressed="true">关注 Tom</button><button class="btn focus-toggle" data-focus="passive" aria-pressed="false">关注这封信</button></div></div></div><div class="hero-sentence" id="hero-sentence"></div><div class="strip"><div><h4><span class="index">01</span>读懂为什么</h4><p>判断谁在做、谁承受，以及想突出谁。</p></div><div><h4><span class="index">02</span>说清怎么变</h4><p>把时态、单复数与过去分词各放对位置。</p></div><div><h4><span class="index">03</span>真正用起来</h4><p>在通知、报道、工序说明中自然使用。</p></div></div>`;
const theory=[
hero,
`${head(1)}<div class="note"><strong>先想，再揭晓。</strong>每题说出一句理由。诊断不计分，用来决定后面哪些内容值得多讲。</div>${trainer('diagnostic','你的起点在哪里？')}<div class="block controls">${jump(2,'从“为什么”开始')}</div>`,
`${head(2)}<div class="two"><div class="paper cream"><div class="label">同一事件 · 关注执行者</div><p class="example"><span class="subject">Tom</span> delivers a letter.</p><p class="explain space">我们在介绍 Tom 的日常工作。<br><strong>Tom 是话题，放在前面。</strong></p></div><div class="paper green"><div class="label">同一事件 · 关注承受者</div><p class="example"><span class="object">A letter</span> is delivered by Tom.</p><p class="explain space">我们在介绍这封信的递送。<br><strong>信成为话题，动作关系仍然相同。</strong></p></div></div><div class="three block"><div class="paper"><div class="task-number">01</div><h3>不知道是谁</h3><p class="example">My bike was stolen.</p><p class="explain space">自行车被偷了。我们不知道偷车的人，重点是车发生了什么。</p></div><div class="paper"><div class="task-number">02</div><h3>执行者不重要</h3><p class="example">The classroom is cleaned every day.</p><p class="explain space">说明清洁安排，通常不必逐一交代打扫的人。</p></div><div class="paper"><div class="task-number">03</div><h3>继续讨论这个事物</h3><p class="example">Paper is made from wood. It is used in many ways.</p><p class="explain space">连续介绍纸，让 paper / it 保持为话题，信息更连贯。</p></div></div><div class="paper block"><h3>两个判断，不能省略</h3><ul class="clean-list"><li><strong>语义关系：</strong>句子的主语是这个动作的执行者，还是承受者？</li><li><strong>表达目的：</strong>当前语境中，哪一部分值得先说、需要强调？</li></ul><p class="explain space">主语是人，也可能承受动作：<span class="en">I was invited.</span> 主语是物，也可能用主动：<span class="en">The bus arrived.</span></p></div><div class="note"><strong>别把 by 当成唯一信号。</strong><span class="en">by Tom</span> 可以引出执行者；<span class="en">by bus</span> 表方式，<span class="en">by Friday</span> 表截止时间，都不能单独证明是被动。</div>`,
`${head(3)}<div class="paper"><div class="rule"><div class="tile">主语<small>承受这个动作</small></div><span class="plus">+</span><div class="tile blue">be<small>进入时态结构</small></div><span class="plus">+</span><div class="tile green">done<small>动词的过去分词</small></div></div><p class="rule-caption">最常见的被动框架：主语 + be 的相应形式 + 过去分词。</p></div><div class="two block"><div class="paper"><h3>先理解 be 的工作</h3><p class="example">The room <span class="verb">is</span> cleaned.<br>The rooms <span class="verb">were</span> cleaned.</p><p class="explain space">简单时态里，be 的形式体现时间和主谓一致。完成时由 <strong>has / have</strong> 领头；将来和情态结构由 <strong>will / must</strong> 等领头。</p></div><div class="paper green"><h3>再认准 done 是什么</h3><p class="example">clean → cleaned<br>build → built<br>write → written</p><p class="explain space">done 是“过去分词”的代称。它不一定和过去式相同，也不一定以 -ed 结尾；同一动词的分词不随人称或时态改变。</p></div></div><div class="table-wrap block"><table class="mini-table"><thead><tr><th>原形</th><th>过去式</th><th>过去分词</th><th>观察点</th></tr></thead><tbody><tr><td class="en">write</td><td class="en">wrote</td><td class="en">written</td><td>三种形式不同</td></tr><tr><td class="en">give / see / take</td><td class="en">gave / saw / took</td><td class="en">given / seen / taken</td><td>不要误用过去式</td></tr><tr><td class="en">build / buy / teach</td><td class="en">built / bought / taught</td><td class="en">built / bought / taught</td><td>过去式与分词相同</td></tr><tr><td class="en">cut / put / spread</td><td class="en">cut / put / spread</td><td class="en">cut / put / spread</td><td>原形、过去式、分词相同</td></tr></tbody></table></div>${trainer('concept','搭结构：每次检查一个位置')}`,
`${head(4)}<div class="controls block"><label class="small" for="transform-select">选择例句</label><select class="select" id="transform-select">${D.transforms.map((x,i)=>`<option value="${i}">${i+1}. ${esc(x.active.join(' '))}</option>`).join('')}</select></div><div class="paper block"><div class="steps"><button class="step-btn active" data-step="0">先看主动句</button><button class="step-btn" data-step="1">① 宾语到句首</button><button class="step-btn" data-step="2">② 重组谓语</button><button class="step-btn" data-step="3">③ 处理执行者</button></div><div id="transform-board"></div></div><div class="two block"><div class="paper"><h3>转换后四项复核</h3><ul class="clean-list"><li>原来的承受者，是否成为新主语？</li><li>原来的时间和时态，是否保留？</li><li>助动词是否与新主语一致？</li><li>过去分词和时间状语是否正确？</li></ul></div><div class="paper cream"><h3>代词会换“位置形式”</h3><p class="example">him → <span class="subject">He</span><br>she → by <span class="object">her</span></p><p class="explain space">作主语用主格；放在 by 后用宾格。<br><span class="en">I ↔ me / he ↔ him / she ↔ her / we ↔ us / they ↔ them</span></p></div></div>`,
`${head(5)}<div class="tense-tabs" id="tense-tabs">${D.tenses.map((t,i)=>`<button class="tense-tab ${i===0?'active':''}" data-tense="${i}" aria-pressed="${i===0}">${t.name}<small>${t.level}</small></button>`).join('')}</div><div class="paper" id="tense-board"></div><div class="two block"><div class="paper cream"><h3>being：正在被……</h3><p class="example">The bridge <span class="verb">is being repaired</span>.</p><p class="explain space">强调修桥过程正在发生。<br><strong>is + being + repaired</strong> 三部分都需要。</p></div><div class="paper green"><h3>been：已经被……</h3><p class="example">The bridge <span class="verb">has been repaired</span>.</p><p class="explain space">强调修桥已完成，并与现在有关。<br><strong>has + been + repaired</strong> 顺序不能乱。</p></div></div><div class="note"><strong>先问语境，再看时间词。</strong>now 既可能说明正在发生的动作，也可能描述当前状态；this week 也可能配合不同的时态。用“正在 / 已经 / 通常 / 将来”说清意思后，再选择结构。</div>`,
`${head(6)}<div class="paper green"><h3>找到第一个助动词</h3><div class="rule"><div class="tile blue">has<small>第一个助动词</small></div><div class="tile">been<small>be 的过去分词</small></div><div class="tile green">finished<small>实义动词过去分词</small></div></div><p class="rule-caption">否定：not 放在第一个助动词后；一般疑问：把第一个助动词提到主语前。</p></div><div class="table-wrap block"><table class="mini-table"><thead><tr><th>肯定</th><th>否定</th><th>一般疑问</th></tr></thead><tbody><tr><td class="en">The room is cleaned.</td><td class="en">The room <strong>is not</strong> cleaned.</td><td class="en"><strong>Is</strong> the room cleaned?</td></tr><tr><td class="en">The letter was sent.</td><td class="en">The letter <strong>was not</strong> sent.</td><td class="en"><strong>Was</strong> the letter sent?</td></tr><tr><td class="en">It will be built.</td><td class="en">It <strong>will not</strong> be built.</td><td class="en"><strong>Will</strong> it be built?</td></tr><tr><td class="en">It has been finished.</td><td class="en">It <strong>has not</strong> been finished.</td><td class="en"><strong>Has</strong> it been finished?</td></tr></tbody></table></div><div class="two block"><div class="paper"><h3>特殊疑问句</h3><p class="example">When <span class="verb">was</span> the bridge built?<br>Where <span class="verb">will</span> the trees be planted?</p><p class="explain space">常见结构：疑问词 + 第一个助动词 + 主语 + 剩余部分。<br>主语本身被提问时另作分析：<span class="en">What was stolen?</span></p></div><div class="paper cream"><h3>简短回答</h3><p class="example">Was the letter sent?<br>Yes, it was. / No, it wasn’t.</p><p class="explain space">回答保留对应的主语代词和第一个助动词。<br><span class="en">Has it been finished? — Yes, it has.</span></p></div></div>`,
`${head(7)}<div class="paper"><h3>01 / 双宾语：人和物，都可能成为主语</h3><p class="example">My mum gave <span class="subject">me</span> <span class="object">a gift</span>.</p><div class="compare space"><div class="compare-item"><p class="en">I was given a gift.</p><small>人作主语：me → I，另一宾语 a gift 保留。</small></div><div class="compare-item"><p class="en">A gift was given <strong>to me</strong>.</p><small>物作主语：说明接收者时，用 to me。</small></div></div><p class="explain space">常见搭配：<strong>give / send / show / lend / pass + to</strong>；<strong>buy / make / cook + for</strong>。先确认具体动词搭配，不能只按“人 / 物”机械猜介词。</p><p class="example space">A cake was bought <em>for me</em>.</p></div><div class="paper block"><h3>02 / 感官与使役：区分原句到底带什么</h3><div class="table-wrap space"><table class="mini-table"><thead><tr><th>主动结构</th><th>被动表达</th><th>要点</th></tr></thead><tbody><tr><td class="en">They made him work.</td><td class="en">He was made <strong>to work</strong>.</td><td>make sb do → be made to do</td></tr><tr><td class="en">We saw him enter.</td><td class="en">He was seen <strong>to enter</strong>.</td><td>see sb do → be seen to do</td></tr><tr><td class="en">We saw him running.</td><td class="en">He was seen <strong>running</strong>.</td><td>原来是 doing，保留 doing</td></tr><tr><td class="en">They asked him to help.</td><td class="en">He was asked <strong>to help</strong>.</td><td>本来就带 to，保留</td></tr><tr><td class="en">They let him leave.</td><td class="en">He was <strong>allowed to leave</strong>.</td><td>表达许可时通常改用 allow</td></tr></tbody></table></div><div class="note"><strong>修正口诀的边界。</strong>make 和 see / hear 等常见感官结构可按上表处理；let、have 不能统统照搬为“被动加 to”。<span class="en">have something done</span> 常表示安排别人完成某事，如 <span class="en">I had my bike repaired.</span>，应另作结构学习。</div><p class="explain space"><span class="en">help sb (to) do</span> 的被动常用 <span class="en">be helped to do</span>。<span class="en">make a model</span> 中 make 表“制作”，没有省略 to 的问题：<span class="en">A model was made.</span></p></div><div class="two block"><div class="paper green"><h3>03 / 动词短语保持完整</h3><p class="example">She looks after the child.<br>The child is <span class="verb">looked after</span>.</p><p class="explain space">介词短语中的宾语也可能进入被动结构；look after、take care of、laugh at 等要作为整体分析，不能丢掉介词。</p></div><div class="paper cream"><h3>04 / 宾语补足语留下来</h3><p class="example">We keep the room clean.<br>The room is <span class="verb">kept clean</span>.</p><p class="explain space">room 成为主语；clean 仍然说明它的状态。<br><span class="en">We found the door open.</span><br><span class="en">The door was found open.</span></p></div></div>`,
`${head(8)}<div class="two"><div class="paper cream"><h3>没有这种被动关系</h3><p class="example">The accident <span class="verb">happened</span>.<br>The meeting <span class="verb">took place</span>.<br>The bus <span class="verb">arrived</span>.</p><p class="explain space">happen、take place、arrive 在这些用法中没有可提升的宾语。belong to、consist of 等关系结构通常也不用被动。</p></div><div class="paper green"><h3>有些动词，要看具体意义</h3><p class="example">This house <span class="verb">is owned</span> by my aunt.<br>The team <span class="verb">is made up of</span> ten players.</p><p class="explain space">own 可以用于被动。make up 也可构成 <span class="en">be made up of</span>。原稿把它们一概列为“无被动”，需要修正。</p></div></div><div class="paper block"><h3>主动形式表达被动意味：先分清“属性”和“事件”</h3><div class="compare space"><div class="compare-item"><p class="en">This book sells well.</p><small>描述书的销售表现，sell 用主动。</small></div><div class="compare-item"><p class="en">The book was sold yesterday.</p><small>说明昨天发生了一次出售事件，用被动。</small></div></div><p class="explain space">类似表达：<span class="en">The pen writes smoothly. / The clothes wash easily. / The door won’t open.</span> “物作主语”并不能直接决定语态，仍需理解具体动词意义。</p></div><div class="two block"><div class="paper"><h3>常用特殊表达</h3><p class="example">My bike needs repairing.<br>= My bike needs to be repaired.</p><p class="explain space">need / require / want doing 在相应语境中可以表示被动含义，其中 want doing 常见于英式用法。<br><span class="en">The film is worth watching.</span><br><span class="en">Who is to blame?</span>（应受责备）</p></div><div class="paper"><h3>系动词与状态</h3><p class="example">The cake tastes good.<br>The door is open.</p><p class="explain space">taste 在此表示“尝起来”；open 在第二句是形容词。<span class="en">The door was opened by Mia.</span> 才明确说明开门动作。<br>形容词和分词有时形式重叠，应结合上下文判断。</p></div></div>${trainer('clinic','错因诊所：先定位，再修正')}`,
`${head(9)}<div class="process"><div class="paper"><div class="number">01</div><h3>找谓语位置</h3><p>这个空要构成主句谓语，还是修饰名词、表示目的等？</p></div><div class="paper"><div class="number">02</div><h3>看动作关系</h3><p>主语或被修饰名词，是动作的发出者还是承受者？</p></div><div class="paper"><div class="number">03</div><h3>定时间与一致</h3><p>结合完整语境，再检查时态、单复数和第一个助动词。</p></div><div class="paper"><div class="number">04</div><h3>查动词链</h3><p>be、been、being 是否齐全？分词、介词和 to 是否正确？</p></div></div><div class="paper block"><h3>这一次，先别急着加 be</h3><p class="example">The photos <span class="object">taken by Mia</span> <span class="verb">are</span> on the wall.</p><p class="explain space">主句已有谓语 <strong>are</strong>。taken by Mia 修饰 photos，是过去分词短语。<br>如果要写完整定语从句：<span class="en">The photos <strong>that were taken by Mia</strong> are on the wall.</span></p><div class="note"><strong>不是每个带被动含义的空，都需要 be + done。</strong>先判断句子结构，再确定是限定谓语还是非谓语。</div></div>${trainer('context','换一个语境，还会判断吗？')}`,
`${head(10)}<div class="note"><strong>题目范围与答案性质。</strong>完整保留原稿 10 道单选、12 道单句填空。原稿未提供考试出处，统一称为“原稿练习”；以下答案为教学参考推导，多解题单独说明。</div>${trainer('source-choice','原稿 · 单项选择')}${trainer('source-fill','原稿 · 单句填空')}`,
`${head(11)}<div class="passage-top"><div><h3 id="passage-title"></h3><p class="explain" id="passage-subtitle"></p></div><div class="controls"><button class="btn soft" data-passage="0" aria-pressed="true">音乐社团</button><button class="btn" data-passage="1" aria-pressed="false">太空探索</button></div></div><div class="note" style="margin-bottom:24px"><strong>先读段落，再选空位。</strong>点击原文中的编号，右侧同步讲解。补出的词可以随答案开关显隐；多解说明需要结合段落一起看。</div><div class="passage-workbench"><article class="reading-paper" id="passage-text" aria-label="语篇原文"></article><aside class="passage-rail" id="passage-rail" aria-label="逐空解析"></aside></div><div class="font-tools screen-only"><label>原文 <input class="sync-font" data-kind="reading" type="range" min="18" max="34" value="24" aria-label="语篇原文字号"></label><label>解析 <input class="sync-font" data-kind="analysis" type="range" min="16" max="28" value="20" aria-label="语篇解析字号"></label></div>`,
`${head(12)}<div class="note"><strong>先说清读者和目的。</strong>下面三项任务允许多种表达。决定哪些句子适合用被动，再写出自然的完整句子。</div><div class="paper block writing-task"><div class="task-number">01 / 校园告示</div><h3>让规则说得清楚</h3><p class="explain">为图书馆写两条告示：书按时归还；室内保持安静。尝试使用 must / should 的被动结构。</p><textarea class="writing-area" aria-label="校园告示练笔" placeholder="Books ..."></textarea><details class="writing-ref"><summary>展开参考表达与点评</summary><div class="answer"><p class="example">Books must be returned on time.<br>Quiet should be maintained in the library.</p><p class="explain space">must 表要求，should 表建议。也可以自然地写 <span class="en">Please keep quiet.</span>；实际告示不必每句都强行改成被动。</p></div></details></div><div class="paper block writing-task"><div class="task-number">02 / 校园新闻</div><h3>围绕“新花园”保持话题</h3><p class="explain">向校报读者介绍：志愿者上周建好花园；学生种了二十棵树；下周将在那里举办活动。写 3 句，恰当保留执行者。</p><textarea class="writing-area" aria-label="校园新闻练笔" placeholder="A new garden ..."></textarea><details class="writing-ref"><summary>展开参考表达与点评</summary><div class="answer"><p class="example">A new garden was built by volunteers last week.<br>Twenty trees were planted by students.<br>An activity will be held there next week.</p><p class="explain space">新闻介绍花园和相关成果，适合把它们放在句首。volunteers / students 有信息价值，可保留 by 短语。hold → held。</p></div></details></div><div class="paper block writing-task"><div class="task-number">03 / 工序说明</div><h3>让读者看懂一件事怎么完成</h3><p class="explain">根据流程介绍纸张回收：收集旧纸 → 分类 → 制成新纸。写 3 句，并说明为什么这些句子适合用被动。</p><textarea class="writing-area" aria-label="工序说明练笔" placeholder="First, used paper ..."></textarea><details class="writing-ref"><summary>展开参考表达与点评</summary><div class="answer"><p class="example">First, used paper is collected.<br>Then, it is sorted.<br>Finally, it is made into new paper.</p><p class="explain space">流程说明关注材料经历的步骤，执行者通常不必交代。按一般流程用一般现在时；paper 为不可数名词。</p></div></details><div class="checklist"><label><input type="checkbox"> 主语与动作关系清楚</label><label><input type="checkbox"> 时间与单复数正确</label><label><input type="checkbox"> 动词链完整</label><label><input type="checkbox"> 表达自然</label></div></div>${trainer('exit','离堂六题：带着理由离开')}`,
`${head(13)}<div class="two"><div class="paper green"><div class="label">第 1 课时 / 45 分钟 · 从意义到结构</div><h3>会判断，会搭建</h3><div class="route"><span>情境 4′</span><span>诊断 5′</span><span>意义与结构 9′</span><span>转换 10′</span><span>核心时态 10′</span><span>句式与反馈 7′</span></div><p class="explain space">基础班先掌握一般现在、一般过去、一般将来与情态被动；完成/进行被动留给第二课时或课后选学。</p></div><div class="paper cream"><div class="label">第 2 课时 / 45 分钟 · 从辨析到表达</div><h3>会解释，会使用</h3><div class="route"><span>提取复习 4′</span><span>特殊结构 8′</span><span>错因诊所 7′</span><span>语篇选讲 11′</span><span>表达任务 10′</span><span>离堂反馈 5′</span></div><p class="explain space">语篇根据班级水平选一篇；其余作为巩固。72 个练习点构成题库，不要求两课时全部做完。</p></div></div><div class="paper block"><h3>内容范围与来源</h3><ul class="clean-list"><li>原稿：10 道单选、12 道单句填空、2 篇各 10 空语篇，共 <strong>42 个练习点</strong>，全部保留。</li><li>新增：诊断 4 题、结构巩固 6 题、纠错 8 题、语境判断 6 题、离堂检测 6 题，共 <strong>30 题</strong>。</li><li>另有 <strong>3 项表达任务</strong>，提供参考表达和点评，不计入 72 题。</li><li>新增教学内容：语用焦点、主语是人/物的误区、过去式与过去分词、第一助动词、短语整体、非谓语判断、时态参照与多解讨论。</li></ul></div><div class="paper block"><h3>原稿修订与讲授边界</h3><details open><summary>修正“无被动”清单</summary><div class="explain">own 可以使用被动（<span class="en">The house is owned by...</span>）；make up 可以构成 <span class="en">be made up of</span>。have 表拥有时通常不用被动，但不能把整个词在所有意义中一概封禁。happen、arrive 等按具体用法说明；look after 等介词短语可有被动。</div></details><details><summary>修正“还原 to”口诀</summary><div class="explain">重点讲 make、see、hear 等典型结构；let 表许可时常改为 be allowed to；have sb do 不能机械改为 be had to do。感官动词原为 doing 时，保留 doing。</div></details><details><summary>修正拼写、绝对化与未经核验的“真题”标签</summary><div class="explain">原稿 to be blame 改为 to blame；不采用“90% 省略 by”等无出处比例。原稿题目没有考试来源，不将它们标注为已核验真题。原题措辞和选项保留，包括 highspeed；课堂呈现时说明常见写法为 high-speed。</div></details><details><summary>保留多解并说明条件</summary><div class="explain">原稿填空第3题 now、第10题未明确叙事时间；音乐篇第4空 this week；太空篇第2空完成时参照、第3/4/10空转述视角、第7空 try / trying、第8空 checking / to be checked，均在逐题解析中交代语境。参考答案不能替代上下文判断。</div></details><details><summary>“be + done”也要分析位置与意义</summary><div class="explain">简单时态由 be 体现时间和一致；完成/将来/情态结构由整条助动词链表达。过去分词修饰名词时不一定另加 be；be 后接形容词也不必然是被动。bear doing 等少见搭配不作为通用初中口诀。</div></details></div><div class="paper block"><h3>板书与反馈建议</h3><div class="rule"><div class="tile">谁承受？</div><div class="tile blue">何时发生？</div><div class="tile green">结构完整吗？</div></div><p class="explain">左侧板书：动作执行者 → 动作 → 承受者；中间板书：常见被动结构；右侧记录学生出现的具体错因。课末让学生用自己的语言解释一题，而不仅报出答案。</p></div><div class="source-note"><strong>教学核对参考：</strong><a href="https://dictionary.cambridge.org/grammar/british-grammar/passive-voice" target="_blank" rel="noopener">Cambridge English Grammar Today · Passive voice</a>；<a href="https://dictionary.cambridge.org/grammar/british-grammar/make" target="_blank" rel="noopener">Cambridge · Make</a>。本课件基于用户讲义重新组织，新增例句与练习为教学编写；涉及原题现实事件的陈述不作为事实核验结论。</div><div class="controls block screen-only"><button class="btn" data-print="student">打印 / 导出学生讲义</button><button class="btn primary" data-print="teacher">打印 / 导出教师讲义</button></div>`
];
document.getElementById('course').innerHTML=theory.map((html,i)=>`<section class="chapter" id="chapter-${i}" aria-label="${titles[i]}" ${i?'hidden':''}>${html}</section>`).join('');
document.getElementById('chapter-tabs').innerHTML=titles.map((t,i)=>`<button class="tab" data-chapter="${i}" aria-selected="${i===0}" aria-controls="chapter-${i}"><span class="n">${String(i+1).padStart(2,'0')}</span>${t}</button>`).join('');
document.getElementById('menu-grid').innerHTML=titles.map((t,i)=>`<button class="menu-item" data-jump="${i}"><b>${String(i+1).padStart(2,'0')}</b>${t}<small>${stageLabels[i]}</small></button>`).join('');
function answerHTML(q){
 const prefix=q.options?`${String.fromCharCode(65+q.correct)} · `:'';
 return `<div class="answer-list">${q.answer.map((a,i)=>`<span>${i===0?prefix:''}${esc(a)}</span>`).join('')}</div><p class="reason">${esc(q.reason)}</p>${q.caution?`<div class="caution"><strong>语境 / 教学提示：</strong>${esc(q.caution)}</div>`:''}${q.options?`<div class="option-analysis">${q.analyses.map((s,i)=>`<div class="${i===q.correct?'hit':''}"><strong>${String.fromCharCode(65+i)}</strong> · ${esc(s)}</div>`).join('')}</div>`:''}`;
}
function questionHTML(q,index,total){
 const selected=responses.get(q.id),reveal=reveals.has(q.id);
 return `<article class="question ${reveal?'revealed':''}" data-question="${q.id}"><div class="q-meta">${pill(q.origin)}${pill(q.tag)}<span>${String(index+1).padStart(2,'0')} / ${total}</span></div><p class="q-prompt en">${esc(q.prompt)}</p>${q.options?`<div class="options">${q.options.map((o,i)=>`<button class="option ${selected===i?'selected':''}" data-choice="${i}" data-question="${q.id}" data-correct="${i===q.correct}" aria-pressed="${selected===i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>`:`<textarea class="q-input" data-response="${q.id}" aria-label="${q.id} 作答" placeholder="先口头说理由，也可以在这里写下答案。">${esc(typeof selected==='string'?selected:'')}</textarea>`}<div class="q-controls"><button class="btn soft" data-reveal="${q.id}" aria-expanded="${reveal||showAnswers}">${showAnswers?'隐藏全部答案':reveal?'收起本题解析':'揭晓答案与解析'}</button><div class="controls"><button class="btn" data-qmove="-1" data-group="${q.group}" ${index===0?'disabled':''}>上一题</button><button class="btn" data-qmove="1" data-group="${q.group}" ${index===total-1?'disabled':''}>下一题</button></div></div><div class="answer">${q.options&&Number.isInteger(selected)?`<p class="answer-feedback">你选择了 ${String.fromCharCode(65+selected)}；参考选择为 ${String.fromCharCode(65+q.correct)}。对照下面的理由检查。</p>`:''}${answerHTML(q)}</div></article>`;
}
function renderTrainer(group){
 const list=groups[group],pos=groupPos[group]||0,host=document.querySelector(`.trainer[data-group="${group}"] .trainer-body`);
 host.innerHTML=`<nav class="qnav" aria-label="${group} 题目导航">${list.map((q,i)=>`<button data-qindex="${i}" data-group="${group}" aria-label="第${i+1}题" ${i===pos?'aria-current="true"':''} class="${i===pos?'active':''} ${responses.has(q.id)?'answered':''}">${i+1}</button>`).join('')}</nav>${questionHTML(list[pos],pos,list.length)}`;
}
function renderHero(){
 document.getElementById('intro-scene').classList.toggle('passive',focusPassive);
 document.querySelectorAll('.focus-toggle').forEach(b=>{const hit=(b.dataset.focus==='passive')===focusPassive;b.classList.toggle('soft',hit);b.setAttribute('aria-pressed',hit);});
 document.getElementById('hero-sentence').innerHTML=focusPassive?'<div><p class="en"><span class="object">A letter</span> <span class="verb">is delivered</span> by Tom.</p><small>被动视角 · 信是这句话的关注点。</small></div><span class="pill">事件相同，焦点改变</span>':'<div><p class="en"><span class="subject">Tom</span> <span class="verb">delivers</span> a letter.</p><small>主动视角 · 我们先说 Tom 做了什么。</small></div><span class="pill">点击上方按钮，换个焦点</span>';
}
function renderTransform(){
 const t=D.transforms[transformIndex],s=transformStep;
 const token=(text,type,ghost=false)=>`<span class="word ${type}-word ${ghost?'ghost':''}">${esc(text)}</span>`;
 let after=s===0?'<span class="muted small">先找出原句中的执行者、动作和承受者。</span>':token(t.passive[0],'object')+' '+token(s>=2?t.passive[1]:'be + done','verb',s<2)+' '+token(s>=3?t.passive[2]:'by + 执行者','subject',s<3)+' '+token(t.passive[3],'',s<2);
 document.getElementById('transform-board').innerHTML=`<div class="label">主动句 / 先识别角色</div><div class="sentence-row">${token(t.active[0],'subject')}${token(t.active[1],'verb')}${token(t.active[2],'object')}${token(t.active[3],'')}</div><div class="transform-arrow" aria-hidden="true">↓</div><div class="sentence-row" aria-live="polite">${after}</div><p class="step-explain">${s?t.why[s-1]:'执行者在前，动作在中间，承受者在后。点下一步，观察角色如何变化。'}</p>`;
 document.querySelectorAll('[data-step]').forEach(b=>{const hit=+b.dataset.step===s;b.classList.toggle('active',hit);b.setAttribute('aria-pressed',hit);});
}
function tenseHTML(t){return `<div class="label">${t.level} / ${t.clue}</div><h3>${t.name}的被动表达</h3><div class="formula-large">${t.form}</div><div class="compare"><div class="compare-item"><div class="label">主动</div><p class="en">${esc(t.active)}</p></div><div class="compare-item"><div class="label">被动</div><p class="en">${esc(t.example)}</p></div></div><p class="explain space">${esc(t.explain)}</p><div class="form-rows"><div class="form-row"><label>否定</label><p class="en">${esc(t.negative)}</p></div><div class="form-row"><label>一般疑问</label><p class="en">${esc(t.question)}</p></div></div>`;}
function renderTense(){document.getElementById('tense-board').innerHTML=tenseHTML(D.tenses[tenseIndex]);document.querySelectorAll('[data-tense]').forEach(b=>{const hit=+b.dataset.tense===tenseIndex;b.classList.toggle('active',hit);b.setAttribute('aria-pressed',hit);});}
function passageParagraph(text,pi,printing=false,teacher=false){
 return esc(text).replace(/(\d+)\.\s*_{2,}\s*\(([^)]+)\)/g,(_,n,verb)=>{
  const id=`p${pi+1}-${n}`,q=byId.get(id),on=printing?teacher:showAnswers||reveals.has(id);
  if(printing)return `<span class="blank">${n}. ${on?esc(q.answer[0]):'____________'}</span> <span class="verb-hint">(${verb})</span>`;
  return `<button class="blank ${+n===passageBlank?'active':''} ${on?'filled':''}" data-blank="${n}" aria-label="第${n}空${on?' '+esc(q.answer[0]):''}">${n}. ${on?esc(q.answer[0]):'______'}</button> <span class="verb-hint">(${verb})</span>`;
 });
}
function renderPassage(){
 const p=D.passages[passageIndex],list=groups[`passage${passageIndex+1}`],q=list[passageBlank-1],on=showAnswers||reveals.has(q.id);
 document.getElementById('passage-title').textContent=p.title;document.getElementById('passage-subtitle').textContent=p.subtitle;
 document.querySelectorAll('[data-passage]').forEach(b=>{const hit=+b.dataset.passage===passageIndex;b.setAttribute('aria-pressed',hit);b.classList.toggle('soft',hit);});
 document.getElementById('passage-text').innerHTML=p.paragraphs.map(t=>`<p>${passageParagraph(t,passageIndex)}</p>`).join('');
 document.getElementById('passage-rail').innerHTML=`<div class="label">逐空讲解 / ${p.theme}</div><nav class="qnav" aria-label="语篇空位导航">${list.map((x,i)=>`<button data-blank="${i+1}" aria-label="语篇第${i+1}空" class="${i+1===passageBlank?'active':''} ${reveals.has(x.id)?'answered':''}" ${i+1===passageBlank?'aria-current="true"':''}>${i+1}</button>`).join('')}</nav><div class="${reveals.has(q.id)?'revealed':''}"><div class="controls">${pill('第 '+passageBlank+' 空')}${pill(q.tag)}</div><p class="passage-context">${esc(q.prompt)}</p><button class="btn soft space" data-passage-reveal="${q.id}" aria-expanded="${on}">${showAnswers?'隐藏全部答案':on?'收起本题答案':'揭晓本题答案'}</button><div class="answer space">${answerHTML(q)}</div></div><div class="q-controls"><span class="position">${passageBlank} / 10</span><button class="btn" data-next-blank="true">${passageBlank===10?'回到第1空':'下一空 →'}</button></div>`;
}
function teacherHTML(i){const n=D.notes[i];return `<div class="panel-head"><div><div class="eyebrow">TEACHER’S NOTES</div><h3>${n.title}</h3></div><button class="btn icon" id="teacher-close" aria-label="关闭教师提示">×</button></div><div class="note-label">这节课要解决什么</div><p>${n.goal}</p><div class="note-label">怎么开口讲</div><p>${n.ask}</p><div class="note-label">引导与讲解</div><p>${n.guide}</p><div class="note-label">容易讲过头的地方</div><p>${n.watch}</p><button class="btn" data-jump="13">查看完整备课与修订</button>`;}
function updateFooter(){document.getElementById('footer-label').textContent=`${String(active+1).padStart(2,'0')} / ${titles.length}　${titles[active]}`;document.getElementById('progress-line').style.width=`${(active+1)/titles.length*100}%`;document.getElementById('prev').disabled=active===0;document.getElementById('next').disabled=active===titles.length-1;}
function go(i,fromHistory=false){
 active=Math.max(0,Math.min(titles.length-1,i));document.querySelectorAll('.chapter').forEach((el,j)=>{el.hidden=j!==active;});
 document.querySelectorAll('.tab').forEach((el,j)=>{el.setAttribute('aria-selected',j===active);el.tabIndex=j===active?0:-1;});
 const tab=document.querySelector(`.tab[data-chapter="${active}"]`);tab.scrollIntoView({block:'nearest',inline:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
 updateFooter();document.getElementById('teacher-panel').innerHTML=teacherHTML(active);document.getElementById('course-menu').close();
 if(!fromHistory)history.replaceState(null,'',`#chapter-${active+1}`);
 document.getElementById('announcer').textContent=`第${active+1}节，${titles[active]}`;window.scrollTo({top:0,behavior:'instant'});
}
function toggleTeacher(force){const p=document.getElementById('teacher-panel');p.hidden=force===undefined?!p.hidden:!force;document.getElementById('teacher-toggle').setAttribute('aria-expanded',!p.hidden);}
function globalReveal(force){
 showAnswers=force===undefined?!showAnswers:force;
 if(!showAnswers)reveals.clear();
 document.body.classList.toggle('show-answers',showAnswers);const b=document.getElementById('global-answers');b.textContent=showAnswers?'隐藏答案':'显示答案';b.setAttribute('aria-pressed',showAnswers);
 Object.keys(groups).filter(g=>!g.startsWith('passage')).forEach(renderTrainer);renderPassage();
 document.querySelectorAll('.writing-ref').forEach(el=>{el.open=showAnswers;el.classList.toggle('revealed',showAnswers);});
}
function localReveal(id){
 if(showAnswers){globalReveal(false);return;}
 if(reveals.has(id))reveals.delete(id);else reveals.add(id);
 const q=byId.get(id);if(q.group.startsWith('passage'))renderPassage();else renderTrainer(q.group);
}
function printQuestion(q,i,teacher){return `<article class="print-question"><p><strong>${i+1}. [${esc(q.tag)}]</strong> ${esc(q.prompt).replace(/\n/g,'<br>')}</p>${q.options?`<div class="print-options">${q.options.map((o,j)=>`${String.fromCharCode(65+j)}. ${esc(o)}`).join('　　')}</div>`:'<p>答：__________________________________________________</p>'}<div class="answer"><p><strong>参考：</strong>${q.answer.map(esc).join(' / ')}</p><p>${esc(q.reason)}</p>${q.caution?`<p><strong>条件：</strong>${esc(q.caution)}</p>`:''}${q.options?q.analyses.map((a,j)=>`<p>${String.fromCharCode(65+j)}：${esc(a)}</p>`).join(''):''}</div></article>`;}
function buildPrint(teacher){
 const root=document.getElementById('print-root');root.innerHTML=`<h1>被动语态精讲与专项训练</h1><p>${teacher?'教师完整讲义 · 含参考答案、解析和备课提示':'学生完整讲义 · 保留练习空位'}｜九年级复习与进阶｜原稿42 + 新增30 + 表达任务3</p><p>基于《被动语态精讲与专项训练.docx》重新组织与补充。参考答案为教学推导；语境多解处保留说明。</p>`;
 document.querySelectorAll('.chapter').forEach((section,i)=>{
  const clone=section.cloneNode(true);clone.hidden=false;clone.removeAttribute('id');clone.className='print-unit';
  clone.querySelectorAll('.trainer').forEach(t=>{const g=t.dataset.group;t.innerHTML=`<h3>${t.querySelector('h3').textContent}</h3>`+groups[g].map((q,j)=>printQuestion(q,j,teacher)).join('');});
  const tb=clone.querySelector('#tense-board');if(tb)tb.innerHTML=D.tenses.map(t=>`<div class="paper">${tenseHTML(t)}</div>`).join('');
  const tf=clone.querySelector('#transform-board');if(tf)tf.innerHTML=D.transforms.map(t=>`<p class="en">${esc(t.active.join(' '))}</p><p>改写：________________________________________________</p><div class="answer"><p class="en">${esc(t.passive.join(' '))}</p><p>${t.why.map(esc).join(' ')}</p></div>`).join('');
  const pb=clone.querySelector('.passage-workbench');if(pb)pb.outerHTML=D.passages.map((p,pi)=>`<h3>${p.title}</h3>${p.paragraphs.map(t=>`<p class="print-passage">${passageParagraph(t,pi,true,teacher)}</p>`).join('')}<h3>逐空作答与讲解</h3>${groups[`passage${pi+1}`].map((q,j)=>printQuestion(q,j,teacher)).join('')}`).join('');
  clone.querySelectorAll('details').forEach(d=>d.open=true);
  clone.querySelectorAll('.scene,.scene-note,.font-tools,.controls,.steps,.tense-tabs,.q-controls,.qnav,.q-input,textarea,.checklist,.screen-only,.hero-sentence,select').forEach(el=>el.remove());
  clone.querySelectorAll('button').forEach(el=>el.remove());
  clone.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  if(teacher){const n=D.notes[i];clone.insertAdjacentHTML('beforeend',`<div class="teacher-print-note"><strong>教师提示：</strong>${n.goal}<br><strong>引导：</strong>${n.ask}<br><strong>讲解：</strong>${n.guide}<br><strong>边界：</strong>${n.watch}</div>`);}
  root.append(clone);
 });
 document.body.classList.toggle('print-teacher',teacher);
}
let preparedPrint=false;
function printCourse(teacher){
 buildPrint(teacher);preparedPrint=false;
 const wrap=document.getElementById('print-preview-body');wrap.innerHTML=document.getElementById('print-root').innerHTML;wrap.classList.toggle('teacher-version',teacher);
 document.getElementById('print-preview-title').textContent=teacher?'教师完整讲义预览':'学生完整讲义预览';
 document.getElementById('print-preview-summary').textContent='14 个章节 · 72 个练习点 · 2 篇完整语篇 · 3 项表达任务'+(teacher?' · 含答案、解析、语境条件与教师提示':' · 保留作答空位，隐藏参考答案');
 document.getElementById('settings-panel').hidden=true;document.getElementById('settings-toggle').setAttribute('aria-expanded','false');
 document.getElementById('print-preview').showModal();
}
function confirmPrint(){preparedPrint=true;document.getElementById('print-preview').close();window.print();}
function closePrint(){preparedPrint=false;document.getElementById('print-preview').close();document.body.classList.remove('print-teacher');}

addEventListener('beforeprint',()=>{if(!preparedPrint)buildPrint(false);});
addEventListener('afterprint',()=>{preparedPrint=false;document.body.classList.remove('print-teacher');});
function setFont(kind,value){
 const prop=kind==='lesson'?'--size':`--${kind}-size`;document.documentElement.style.setProperty(prop,value+'px');
 const inp=document.getElementById(kind+'-font'),out=document.getElementById(kind+'-font-value');if(inp)inp.value=value;if(out)out.value=value;
 document.querySelectorAll(`.sync-font[data-kind="${kind}"]`).forEach(x=>x.value=value);
}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.response){responses.set(el.dataset.response,el.value);return;}if(el.classList.contains('sync-font'))setFont(el.dataset.kind,el.value);else if(el.id.endsWith('-font'))setFont(el.id.replace('-font',''),el.value);});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.chapter!==undefined){go(+b.dataset.chapter);return;}
 if(b.dataset.jump!==undefined){go(+b.dataset.jump);return;}
 if(b.dataset.focus){focusPassive=b.dataset.focus==='passive';renderHero();return;}
 if(b.dataset.step!==undefined){transformStep=+b.dataset.step;renderTransform();return;}
 if(b.dataset.tense!==undefined){tenseIndex=+b.dataset.tense;renderTense();return;}
 if(b.dataset.qindex!==undefined){groupPos[b.dataset.group]=+b.dataset.qindex;renderTrainer(b.dataset.group);return;}
 if(b.dataset.qmove!==undefined){const g=b.dataset.group;groupPos[g]=Math.max(0,Math.min(groups[g].length-1,(groupPos[g]||0)+ +b.dataset.qmove));renderTrainer(g);return;}
 if(b.dataset.choice!==undefined){const q=byId.get(b.dataset.question);responses.set(q.id,+b.dataset.choice);renderTrainer(q.group);return;}
 if(b.dataset.reveal){localReveal(b.dataset.reveal);return;}
 if(b.dataset.passageReveal){localReveal(b.dataset.passageReveal);return;}
 if(b.dataset.passage!==undefined){passageIndex=+b.dataset.passage;passageBlank=1;renderPassage();return;}
 if(b.dataset.blank){passageBlank=+b.dataset.blank;renderPassage();return;}
 if(b.dataset.nextBlank){passageBlank=passageBlank%10+1;renderPassage();return;}
 if(b.dataset.print){printCourse(b.dataset.print==='teacher');return;}
 switch(b.id){
 case 'prev':go(active-1);break;case 'next':go(active+1);break;
 case 'menu-open':document.getElementById('course-menu').showModal();break;
 case 'menu-close':document.getElementById('course-menu').close();break;
 case 'teacher-toggle':toggleTeacher();break;case 'teacher-close':toggleTeacher(false);break;
 case 'settings-toggle':{const p=document.getElementById('settings-panel');p.hidden=!p.hidden;b.setAttribute('aria-expanded',!p.hidden);break;}
 case 'global-answers':globalReveal();break;
 case 'motion':{const paused=document.body.classList.toggle('motion-paused');b.setAttribute('aria-pressed',paused);b.textContent=paused?'恢复情境动画':'暂停情境动画';break;}
 case 'fullscreen':if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.();break;
 case 'print-student':printCourse(false);break;case 'print-teacher':printCourse(true);break;
 case 'print-confirm':confirmPrint();break;case 'print-preview-close':closePrint();break;
 }
});
document.addEventListener('change',e=>{if(e.target.id==='transform-select'){transformIndex=+e.target.value;transformStep=0;renderTransform();}});
document.addEventListener('toggle',e=>{if(e.target.matches('.writing-ref'))e.target.classList.toggle('revealed',e.target.open);},true);
document.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,[contenteditable]')||document.getElementById('course-menu').open||document.getElementById('print-preview').open)return;
 if(e.key==='ArrowRight'){e.preventDefault();go(active+1);}else if(e.key==='ArrowLeft'){e.preventDefault();go(active-1);}else if(e.key.toLowerCase()==='a'){globalReveal();}else if(e.key.toLowerCase()==='t'){toggleTeacher();}else if(e.key==='Escape'){toggleTeacher(false);document.getElementById('settings-panel').hidden=true;document.getElementById('settings-toggle').setAttribute('aria-expanded','false');}
});
for(const g of Object.keys(groups))if(!g.startsWith('passage'))renderTrainer(g);
renderHero();renderTransform();renderTense();renderPassage();
if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.body.classList.add('motion-paused');document.getElementById('motion').textContent='恢复情境动画';document.getElementById('motion').setAttribute('aria-pressed','true');}
document.getElementById('print-preview').addEventListener('close',()=>{if(!preparedPrint)document.body.classList.remove('print-teacher');});
const hash=/^#chapter-(\d+)$/.exec(location.hash);go(hash?+hash[1]-1:0,true);

</script>
</body>
</html>
